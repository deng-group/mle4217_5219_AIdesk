# Replace course.example.edu.sg with your real domain.
# Static book files are served from /srv/mle-course-helper/book.
# API requests are proxied to Gunicorn on 127.0.0.1:5055.

server {
    listen 80;
    server_name course.example.edu.sg;

    root /srv/mle-course-helper/book;
    index index.html;

    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://127.0.0.1:5055/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
